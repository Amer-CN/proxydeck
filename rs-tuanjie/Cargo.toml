[package]
name = "rs-tuanjie"
version = "0.1.0"
edition = "2021"
description = "ProxyDeck 团结插件 Rust 重写（绞杀者路线 P8a~P8c 全量；P7d-1 起接进 rs-gui 分发器的 --plugin-tuanjie，测试端口用，未接管 8788）"

[lib]
name = "rs_tuanjie"
path = "src/lib.rs"

[[bin]]
name = "rs-tuanjie"
path = "src/main.rs"

# P8b 第三片的**差分对照 runner**：跑同一串固定请求，把每次响应的
# `{status, content_type, body}` 与假上游观测量写成 JSON，供与 Go 侧对照 diff。
# 不是生产产物（不上 GUI、不发版），只是把「两侧同输入」这件事固化成可复跑的脚本。
[[bin]]
name = "p8b3-diff-run"
path = "src/bin/p8b3_diff_run.rs"

[dependencies]
# 本地 HTTP 服务（P8b 第三片：服务骨架与路由表）。
# 与 rs-bai / rs-comate / rs-codebuddy 同款 0.8 —— 405 补体中间件在本 crate 内自带。
axum = "0.8"
# base64url 无填充（Go `base64.RawURLEncoding`）——签名第三段。
base64 = "0.23"
# 命令行（`--plugin-tuanjie --port`）——与其余 Rust crate 同款。
clap = { version = "4", features = ["derive"] }
# 随机源：Go 用 `crypto/rand`（操作系统 CSPRNG），这里直接用 getrandom 保持同一语义
# （uuid v4、rand36、会话 TTL 随机都要它；不用 `rand` 的用户态 PRNG）。
getrandom = "0.3"
# HMAC-SHA256：两层密钥派生与签名体。与 rs-codebuddy 已用的 `sha2` 同族（**不自己手搓密码学**）。
hmac = "0.12"
sha2 = "0.10"
# 本地时间：Go `time.Time` 的落盘形态（RFC3339 秒精度 + 本地时区偏移）、
# `LastUsed` 的 `2006-01-02 15:04:05` 形态、`Status()` 的 `2006-01-02 15:04` 都按**本机时区**
# 取值（Go 用 `time.Local`）。`clock` 特性提供 `Local::now()`；不用 std，因为 std 没有时区。
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
# raw_value：请求体重排要把客户端的字段值**原样字节**搬过去（对应 Go 的 json.RawMessage）。
# 不开 preserve_order：Go 的 json.Marshal 对 map[string]any 按 key 排序，
# serde_json 默认的 BTreeMap 同样是排序 —— 键序逐字节对齐靠的就是这个默认值。
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
# 会话 id = Go `uuid.New()`（RFC 4122 v4，随机位来自 CSPRNG）。
uuid = { version = "1", features = ["v4"] }
# 出站 HTTP。TLS 栈显式声明（TLS 指纹差异是圆桌点名的风险项）：
# **P8a 用 rustls**（纯 Rust、与其余 crate 同栈）；BoringSSL/wreq 的取舍见 README「uTLS 路线」。
# `gzip`：Go `net/http` 在调用方没显式设 Accept-Encoding 时会**自动补 `Accept-Encoding: gzip`
# 并透明解压**；reqwest 只有开这个特性才有同样行为。出站头集合对齐（P8 验收 2）需要它。
# `stream`：`bytes_stream()`——流式转发（P8b 第四片）与流式空响应嗅探都要它。
reqwest = { version = "0.13", features = ["default-tls", "http2", "gzip", "stream"] }
# 流式转发（P8b 第四片）：把 `reqwest::Response::bytes_stream()` 直接喂给
# `axum::body::Body::from_stream`（池路径/单账号路径的 `wantsStream` 分支），
# 以及空响应嗅探时「先吐已读出的首段、再接上游剩余部分」。
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
# gzip 解包（P8c 种子卫兵在线层）：Go 用 `compress/gzip`，Rust 侧用 flate2。
# **不是新依赖**——它已在依赖树里（reqwest 的 gzip 特性经 miniz_oxide 引入的同一族），
# 这里只是把它显式声明成直接依赖（tar 层是自写的 uSTAR 只读解析，见 `src/gziptar.rs`）。
flate2 = "1"

[profile.release]
opt-level = 2

[dev-dependencies]
# 集成测试里直接驱动 axum 路由（`router(state).oneshot(req)`）——`tower` 的 `ServiceExt`。
# 只在测试目标里用，不进生产依赖。
tower = { version = "0.5", features = ["util"] }
