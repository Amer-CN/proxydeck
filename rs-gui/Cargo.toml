[package]
name = "rs-gui"
version = "0.1.0"
edition = "2021"
description = "ProxyDeck GUI 宿主 Rust 重写（绞杀者路线 P7a：桥接层与状态；单 exe 多子模式）"

[lib]
name = "rs_gui"
path = "src/lib.rs"

[[bin]]
name = "rs-gui"
path = "src/main.rs"

[dependencies]
# Rust crate 作为**库依赖**接入（用户裁决形态：单 exe 多 --plugin-* 子模式）。
# P7d-1 起七路齐了：bai / codebuddy / comate / qoder / tuanjie / vibex / proxy；
# 2026-10-21 起再接入 OpenCode（`--plugin-opencode --port N`，端口 8784）。
rs-bai = { path = "../rs-bai" }
rs-codearts = { path = "../rs-codearts" }
rs-codebuddy = { path = "../rs-codebuddy" }
rs-comate = { path = "../rs-comate" }
# OpenCode：把本机 `opencode serve` 翻成 OpenAI 兼容接口（8784）。
rs-opencode = { path = "../rs-opencode" }
rs-qoder = { path = "../rs-qoder" }
# P7d-1：团结接进分发器（`--plugin-tuanjie --port N` 真起服务）。
rs-tuanjie = { path = "../rs-tuanjie" }
rs-vibex = { path = "../rs-vibex" }
rs-proxy = { path = "../rs-proxy" }

# 桥接层用到 clap 只为把「子模式 argv」交给各 crate 自己的 clap Args 解析器——
# 参数名/默认值/校验与各 crate 单独启动时**完全同源**，不在分发器里重造一遍。
clap = { version = "4", features = ["derive"] }
# 桥接层的同步 HTTP（httpGet/httpOK/httpGetSlow/ccCalib 的 POST、一键更新下载）。
# Go 侧是 net/http 同步调用；这里用 blocking，保持同一执行形态（bind 回调不是 tokio 上下文）。
# `form`：ccCalib 走 `PostForm`（application/x-www-form-urlencoded），与 Go 同款。
reqwest = { version = "0.13", features = ["blocking", "default-tls", "http2", "form"] }
serde = { version = "1", features = ["derive"] }
# 不开 preserve_order：本 crate 的 JSON 写出走 `jsons.rs` 的显式 BTreeMap 构造
# （`obj_sorts_keys_regardless_of_writing_order` 锁死），不依赖 serde_json 默认 Map
# 实现——workspace feature 并集会把它变成 IndexMap（P7d-2 实测），"靠默认值对齐"
# 的说法在 workspace 下不成立，特此更正。
serde_json = { version = "1" }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }

# GUI 外壳（P7c 全部落地；P7a 只做窗口/事件循环与 26 桥的挂载）。
# Windows 上 wry 底层仍是 WebView2，与 Go 版 webview_go 同源。
tao = "0.37"
wry = "0.57"

[build-dependencies]
# P7d-2：把 `winres.rc`（图标 + VERSIONINFO）编译进 exe。用它是因为
# rc.exe / llvm-rc / windres 的发现逻辑已经现成，不自己手搓资源编译。
# 仅 Windows 需要 → target 限定，别处不引入（build.rs 里也整段跳过）。
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# release profile 的唯一真源在仓库根 `Cargo.toml`（workspace 级 `[profile.release]`
# opt-level = 2，与本文件原先逐字相同）。workspace 成员的 `[profile]` 会被 cargo 忽略，
# 故原有那份已在 P7d-2 随「收进 workspace」一并删除，口径不变。
