# ProxyDeck Rust 工作区（绞杀者路线 P7d-2）
#
# 这里只做聚合：把 8 个 `rs-*` crate 收进同一个 workspace，让**一次 `cargo build`
# 全绿**、一条 `cargo test` 跑完全部成员、依赖只解一份 `Cargo.lock`。
# 本轮不迁移任何成员到 `version.workspace = true` / `edition.workspace = true`
# ——各 crate 自己的 `version = "0.1.0"` 原样保留（见下方「版本统一口径」）。
#
# 怎么用（在仓库根跑，和以前按 crate 跑等价）：
#   $env:CARGO_TARGET_DIR = 'E:\cargo-target\rs-gui'   # F: 盘空间紧张，产物放 E:
#   cargo build                        # 全部成员（debug）
#   cargo test                         # 全部成员的测试
#   cargo build --release -p rs-gui    # 只编宿主 exe
#
# 成员清单（8 个，与仓库目录一一对应）：
#   rs-gui      —— 宿主外壳 + 单 exe 多子模式分发器（唯一产出 exe 的成品目标）
#   rs-proxy    —— 主代理核心（55990）
#   rs-bai      —— B.AI 插件（8891）
#   rs-codebuddy—— WorkBuddy 插件（8787 / 8789）
#   rs-comate   —— Comate 插件（8786）
#   rs-qoder    —— Qoder 插件（8785）
#   rs-tuanjie  —— 团结 Cowork 插件（8788）
#   rs-vibex    —— VibeX 插件（8790）

[workspace]
resolver = "2"
members = [
    "rs-bai",
    "rs-codebuddy",
    "rs-comate",
    "rs-gui",
    "rs-proxy",
    "rs-qoder",
    "rs-tuanjie",
    "rs-vibex",
]
# 不写 `exclude`：成员已经**逐条列全**（不是写 `rs-*` 通配），新加目录不会被
# 自动收进 workspace，也就没有「把无关目录当成员」的风险。

# ── 版本统一口径（**本轮不改任何 crate 的版本号**）────────────────────────────
#
# 1. 8 个 crate 现在**全是 `version = "0.1.0"`**，且 release profile 全同
#    （`opt-level = 2`）。版本号是**打包形态的内部标记**，不是用户看到的版本。
# 2. 用户看到的版本只有一处真源：`rs-gui/src/lib.rs` 的 `APP_VERSION` /
#    `CORE_VERSION`（对应 Go 侧 `app/main.go` 的 `appVersion`），由
#    `rs-gui.exe --version` 打印，也是 `rs-gui/winres.rc` 里文件版本资源的来源。
#    **本轮不动这两个常量、也不动 .rc 里的数字**（发版才动）。
# 3. 发版时才需要动的位置（届时逐个一起改，别只改一处）：
#    `rs-gui/src/lib.rs` 的 `APP_VERSION`/`CORE_VERSION`、`rs-gui/version.rc`
#    的 `FILEVERSION`/`PRODUCTVERSION`/`FileVersion`/`ProductVersion` 四个数字、
#    以及（发版纪律规定的）`CHANGELOG.md` 与版本串 8 处。
#    8 个 crate 的 `version = "0.1.0"` **不参与**发版（它们是内部 crate 版本，
#    没有对外可见面；要动的话是一次独立的、统一口径的决定，属用户拍板项）。
# 4. 依赖版本**不当场统一成 workspace 表**：8 个 crate 现有 `clap`/`reqwest`/
#    `serde`/`serde_json`/`tokio` 的大版本本来就一致，进同一个 workspace 后
#    cargo 会解析出**同一份** `Cargo.lock`；版本声明仍留在各 crate 自己的
#    `Cargo.toml` 里，没做 `workspace.dependencies` 继承。哪天要走继承，
#    一次改一个 crate、改完跑 `cargo test`。
#    ⚠ 但「版本声明留在各 crate」**不**等于"特性互不影响"——见第 5 条。
# 5. **但「大版本一样」不等于「行为一样」**——本轮实测出一个真坑（P7d-2）：
#    cargo 的 feature 解析在**整个构建单元内取并集**。`serde_json` 的 `preserve_order`
#    一开，`serde_json::Map` 就从 BTreeMap 变成 IndexMap（键序从字典序变插入序），
#    于是**任何**依赖 `Value` → 字节的合同（逐字节黄金门禁、matrix 旁路）都会变。
#    实测：`rs-bai` 与 `rs-comate`/`rs-proxy`/`rs-qoder`/`rs-vibex`/`rs-gui` 同处一个
#    构建单元时，它的黄金门禁 `golden_adapt` 直接红（F2 出站键序变了）；同一命令
#    `cargo test -p rs-bai`（只选 rs-bai）却绿——**差别只在"选了谁"**。
#    处置（不在本文件里，登记在此备查）：**两个受影响的 crate 都改成显式排键**——
#    `rs-bai` 显式打开 `preserve_order` 并把出站改走 `adapt::go_json_bytes`（先递归
#    排键到 Go 的字典序再编字节，`/health` 同款）；`rs-tuanjie` 的
#    `gojson::write_go_value` 与 `media::write_indent_go` 改成显式 `keys().sort()`
#    （原先靠 BTreeMap 自动排序）。这样两种构建配置下字节一致，不再依赖
#    "碰巧没被并集影响"。教训：**给一个 crate 加 feature 就是给同构建单元的所有 crate 加**。

# 工作区级的 release profile（**唯一的真源**）。
# 8 个成员原先各自那份 `[profile.release] opt-level = 2` 内容与这里逐字相同，
# 已在 P7d-2 随「收进 workspace」一并删除（留着 cargo 会逐个打
# 「profiles for the non root package will be ignored」warning，而口径完全一样）。
[profile.release]
opt-level = 2
