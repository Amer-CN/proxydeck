[package]
name = "rs-codebuddy"
version = "0.1.0"
edition = "2021"
description = "ProxyDeck CodeBuddy 插件 Rust 重写（绞杀者路线 P5a：合同与请求侧，测试端口用，未接入 GUI）"

[[bin]]
name = "rs-codebuddy"
path = "src/main.rs"

[dependencies]
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
# 上游只有 https://copilot.tencent.com（CN）/ https://www.codebuddy.ai（INTL）两条出站；
# TLS 栈显式声明，避免将来上游改默认时静默换栈（TLS 指纹差异是圆桌点名的风险项）。
reqwest = { version = "0.13", features = ["default-tls", "http2", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `requestFingerprint` 要打整份出站体的 sha256 前 6 字节（Go `crypto/sha256`），是**生产路径**
# 上真实用到的，不是测试专用：json.rs 的写出规则与它一起把「可 grep 指纹」逐字节对齐。
sha2 = "0.10"
# `sync` = 探测缓存的互斥；`time` = 11133 退避与探测 TTL；`signal` = Ctrl-C 退出。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }

[profile.release]
opt-level = 2
